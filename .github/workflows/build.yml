name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 仅构建 GUI（Windows），并在产物中附带 config.example.json
  gui:
    name: Build GUI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build GUI binary (Windows)
        run: cargo build --release --features gui --bin ipsender-gui
        working-directory: rust

      - name: Bundle config template with GUI
        shell: pwsh
        run: Copy-Item ..\config.example.json target\release\config.example.json -Force
        working-directory: rust

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipsender-gui-windows
          path: |
            rust/target/release/ipsender-gui.exe
            rust/target/release/config.example.json
          if-no-files-found: error

  # 核心逻辑单元测试（只跑测试，不产出二进制）
  test:
    name: Test (cargo test + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check (no GUI)
        run: cargo check --no-default-features
        working-directory: rust
      - name: cargo test (core logic)
        run: cargo test --no-default-features
        working-directory: rust
